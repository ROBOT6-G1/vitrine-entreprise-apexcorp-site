<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demande de Devis - ApexCorp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

  <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3 text-2xl font-extrabold text-slate-900">
        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
          <i class="fa-solid fa-chart-line text-lg"></i>
        </div>
        <span>Apex<span class="text-blue-600">Corp</span></span>
      </a>
      <nav class="hidden md:flex items-center gap-8 font-semibold text-slate-600 text-sm">
        <a href="index.html" class="hover:text-blue-600 transition">Accueil</a>
        <a href="apropos.html" class="hover:text-blue-600 transition">À propos</a>
        <a href="services.html" class="hover:text-blue-600 transition">Services</a>
        <a href="realisations.html" class="hover:text-blue-600 transition">Réalisations</a>
        <a href="faq.html" class="hover:text-blue-600 transition">FAQ</a>
        <a href="blog.html" class="hover:text-blue-600 transition">Blog</a>
        <a href="contact.html" class="hover:text-blue-600 transition">Contact</a>
      </nav>
    </div>
  </header>

  <div class="bg-slate-900 text-white py-12">
    <div class="max-w-3xl mx-auto px-6 text-center space-y-3">
      <h1 class="text-3xl font-extrabold">Mangataha Devis Maimaimpoana</h1>
      <p class="text-slate-400 text-sm">Fenoina ireto fampahalalana ireto mba hahafahanay mandefa aminao ny fampidirana tetikasa.</p>
    </div>
  </div>

  <section class="py-12 bg-white flex-1 flex items-center justify-center">
    <div class="max-w-2xl w-full mx-auto px-6">
      <form id="devisForm" class="bg-slate-50 p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Anaranao *</label>
            <input type="text" id="devisName" required class="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none text-sm bg-white">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Orinasa (Optional)</label>
            <input type="text" id="devisCompany" class="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none text-sm bg-white">
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">E-mail *</label>
            <input type="email" id="devisEmail" required class="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none text-sm bg-white">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Telefaonina *</label>
            <input type="text" id="devisPhone" required class="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none text-sm bg-white">
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Karazana Service Ilaina *</label>
          <select id="devisService" required class="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none text-sm bg-white">
            <option value="Conseil Stratégique">Conseil Stratégique</option>
            <option value="Création Site Web">Création Site Web</option>
            <option value="Transformation Digitale">Transformation Digitale</option>
            <option value="Marketing Digital">Marketing Digital</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Mombamomba ny Tetikasa sy Budget</label>
          <textarea id="devisDetails" rows="4" required placeholder="Hazavao kely ny momba ny tetikasanao sy ny fotoana tianao hahavitany..." class="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none text-sm bg-white"></textarea>
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition text-sm shadow-md">
          Handefa Ny Fangatahana Devis
        </button>
        <div id="devisSuccess" class="hidden p-3 bg-emerald-100 text-emerald-800 rounded-xl text-xs font-bold text-center">
          Voaray ny fangatahanao! Hifandray aminao ao anatin'ny 24h izahay.
        </div>
      </form>
    </div>
  </section>

  <footer class="bg-slate-900 text-slate-400 py-6 text-center text-sm">
    &copy; 2025 ApexCorp. All rights reserved.
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
