  <div class="bg-sky-700 text-white py-12 text-center">
    <h1 class="text-3xl font-bold">Prise de Rendez-vous en Ligne</h1>
    <p class="text-sky-200 mt-2">Remplissez le formulaire ci-dessous pour réserver votre consultation.</p>
  </div>

  <!-- OPTION 5: PRENDRE RENDEZ-VOUS FORM -->
  <main class="max-w-3xl mx-auto px-4 py-12">
    <div class="bg-white p-8 rounded-2xl shadow-lg border border-slate-100">
      <form id="rdv-form" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Nom complet *</label>
            <input type="text" id="rdv-nom" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-sky-500" placeholder="Ex: Jean Rabemananjara">
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Téléphone *</label>
            <input type="tel" id="rdv-phone" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-sky-500" placeholder="034 00 000 00">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Adresse Email</label>
            <input type="email" id="rdv-email" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-sky-500" placeholder="exemple@email.com">
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Service Requis</label>
            <select id="rdv-service" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-sky-500">
              <option value="Médecine Générale">Médecine Générale</option>
              <option value="Cardiologie">Cardiologie</option>
              <option value="Pédiatrie">Pédiatrie</option>
              <option value="Gynécologie">Gynécologie</option>
              <option value="Laboratoire">Laboratoire & Analyses</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Médecin souhaité (Optionnel)</label>
            <select id="rdv-doctor" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-sky-500">
              <option value="">Aucune préférence</option>
              <option value="Dr Jean Rakoto">Dr Jean Rakoto</option>
              <option value="Dr Marie Rasoa">Dr Marie Rasoa</option>
              <option value="Dr Luc Randria">Dr Luc Randria</option>
              <option value="Dr Sarah Andriama">Dr Sarah Andriama</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Date souhaitée *</label>
            <input type="date" id="rdv-date" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-sky-500">
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Remarques / Symptômes importants</label>
          <textarea id="rdv-note" rows="4" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-sky-500" placeholder="Décrivez vos symptômes ou vos disponibilités spécifiques..."></textarea>
        </div>

        <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-4 rounded-xl shadow-lg transition">Confirmer le Rendez-vous</button>
      </form>
    </div>
  </main>

</body>
